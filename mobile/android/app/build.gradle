plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'cz.soovee.commander'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.soovee.commander'
        minSdk 24
        targetSdk 35
        versionCode 200
        versionName '0.20.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    sourceSets { main { assets.srcDirs += ['../../shared/locales', '../../shared/licenses'] } }
}
chaquopy {
    defaultConfig {
        version '3.11'
        buildPython (System.getenv('SOOVEE_BUILD_PYTHON') ?: 'python3.11')
        pip { install 'qrcode' }
    }
    sourceSets { main { srcDir "$buildDir/generated/transfer-core"; srcDir '../../shared/python' } }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.activity:activity:1.9.3"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}

// Package the headless core, not the desktop Qt UI or its asset inventory.
def transferModules = ['__init__.py', 'lan.py', 'lan_protocol.py', 'lan_files.py', 'lan_store.py',
    'device_files.py', 'providers.py', 'nativefs.py', 'operations.py', 'transfer_status.py', 'diagnostic_log.py', 'hkdf.py', 'openssl_psk.py', 'discovery.py']
def syncTransferCore = tasks.register('syncTransferCore', Sync) {
    from('../../../src/soovee_commander') { include transferModules }
    into("$buildDir/generated/transfer-core/soovee_commander")
}
tasks.matching { it.name == 'mergeDebugPythonSources' || it.name == 'mergeReleasePythonSources' }.configureEach {
    dependsOn(syncTransferCore)
}
