name: Build Android and Android TV client
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'src/soovee_commander/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/soovee_commander/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOOVEE_BUILD_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify transfers using the bundled Python version
        run: python mobile/tests/test_transfer_core.py
      - run: gradle --no-daemon -p mobile/android :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SooveeCommander-android-unsigned
          path: mobile/android/app/build/outputs/apk/release/*-unsigned.apk
