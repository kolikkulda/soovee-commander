name: Test and build desktop apps
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, windows, macos]
      run_tests:
        description: Run the full automated test suite (disable only for packaging-only changes)
        type: boolean
        default: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - if: runner.os == 'Windows'
        name: Prepare native dependency cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'soovee-vcpkg-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
      - if: runner.os == 'Windows'
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/soovee-vcpkg-cache
          key: windows-vcpkg-x64-${{ github.run_id }}
          restore-keys: windows-vcpkg-x64-
      - if: runner.os == 'Windows'
        name: Build native archive support
        timeout-minutes: 30
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libarchive:x64-windows-release --overlay-triplets=packaging/triplets
          if ($LASTEXITCODE -ne 0) { throw "libarchive build failed" }
          $archiveBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows-release/bin"
          "LIBARCHIVE=$archiveBin/archive.dll" >> $env:GITHUB_ENV
          $archiveBin >> $env:GITHUB_PATH
      - if: runner.os == 'Windows' && steps.native_cache.outputs.cache-hit != 'true'
        name: Save compiled native dependencies
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/soovee-vcpkg-cache
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
      - run: python -m pip install -e ".[dev]"
      - if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: python -m pytest -x -vv --capture=tee-sys --timeout=90 --timeout-method=thread --durations=10 -o faulthandler_timeout=45
        timeout-minutes: 12
      - name: Restore optional release signing key
        shell: python
        env:
          SOOVEE_UPDATE_SIGNING_KEY: ${{ secrets.SOOVEE_UPDATE_SIGNING_KEY }}
        run: |
          import os
          from pathlib import Path
          value = os.environ.get('SOOVEE_UPDATE_SIGNING_KEY', '')
          if value:
              Path('.release').mkdir(mode=0o700, exist_ok=True)
              path = Path('.release/update-private.pem')
              path.write_text(value)
              path.chmod(0o600)
      - if: runner.os == 'macOS'
        env:
          SOOVEE_PYTHON: python
        run: ./scripts/build_macos.sh
      - if: runner.os == 'Windows'
        run: ./scripts/build_windows.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/SooveeCommander/SooveeCommander.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - if: runner.os == 'Windows'
        name: Verify portable ZIP
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist/SooveeCommander-*-windows-x86_64-portable.zip | Select-Object -First 1
          if (-not $portable) { throw "Windows portable archive was not produced" }
          $destination = Join-Path $env:RUNNER_TEMP "Soovee Portable Test"
          Expand-Archive -Path $portable.FullName -DestinationPath $destination -Force
          $process = Start-Process -FilePath (Join-Path $destination 'SooveeCommander.exe') -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable application smoke test failed" }
      - if: runner.os == 'Windows'
        name: Verify actual installer and uninstaller
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/SooveeCommander-*-windows-x86_64-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $installDir = Join-Path $env:RUNNER_TEMP "Soovee Installer Test"
          $installLog = Join-Path $env:RUNNER_TEMP "soovee-install.log"
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOLAUNCH=1', "/DIR=`"$installDir`"", "/LOG=`"$installLog`"")
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = Join-Path $installDir "SooveeCommander.exe"
          if (-not (Test-Path $executable)) { throw "Installed application is missing" }
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed application smoke test failed" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: SooveeCommander-${{ matrix.os }}
          retention-days: 3   # builds are downloaded right away; keeps Actions storage small
          path: dist/
